<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onibi - Technical Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

        :root {
            --bg-dark: #000000;
            --desktop-gap: 40px;
            --mobile-gap: 25px;
            --base-font-size: 11px;
            --base-line-height: 1.6;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; 
            background-color: var(--bg-dark);
            /* 使用 dvh 确保在移动端动态适配工具栏，解决黑边问题 */
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: fixed; /* 防止 iOS 橡皮筋回弹效果 */
        }

        /* 通用底部文字样式 */
        .ui-text {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            mix-blend-mode: difference; 
            color: #fff;
            font-size: var(--base-font-size);
            letter-spacing: 0.05em;
            transition: color 0.5s ease, opacity 0.5s ease;
            line-height: var(--base-line-height);
        }

        body.profile-active .ui-text {
            mix-blend-mode: normal;
            color: #000;
        }

        body.force-white .ui-text {
            mix-blend-mode: normal;
            color: #ffffff;
        }

        .bottom-left-area {
            left: var(--desktop-gap);
            bottom: var(--desktop-gap);
            text-align: left;
            max-width: 500px;
        }

        .brand-name {
            position: fixed;
            right: var(--desktop-gap);
            bottom: calc(var(--desktop-gap) + (var(--base-font-size) * var(--base-line-height) * 3)); 
            text-transform: uppercase;
            pointer-events: auto;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .brand-name:hover {
            opacity: 0.7;
        }

        .page-counter {
            position: fixed;
            right: var(--desktop-gap);
            bottom: var(--desktop-gap);
        }

        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s;
            will-change: transform, opacity;
            overflow: hidden;
            background-color: #000;
            opacity: 0;
            /* 初始状态不使用 scale，避免视觉缝隙，改用纯位移或透明度 */
            transform: translateY(0); 
            z-index: 1;
            pointer-events: none;
        }

        .section.active {
            opacity: 1;
            transform: translateY(0);
            z-index: 10;
            pointer-events: auto;
        }

        .section.inactive {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        #sec-profile {
            background-color: #ffffff;
        }

        .video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
        }

        #sec-1-replicated .video-container {
            padding: 60px; 
            background-color: #ffffff; 
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sec-1-replicated .bg-asset {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bg-asset {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        video.bg-asset.visible {
            opacity: 1;
        }

        .section-image-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #sec-4 .section-image-bg, 
        #sec-4-copy .section-image-bg,
        #sec-4-copy-replicated .section-image-bg {
            background-position: bottom center;
        }

        .top-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            :root {
                --base-font-size: 9px;
            }
            .ui-text {
                bottom: var(--mobile-gap);
            }
            .bottom-left-area {
                left: 20px;
                bottom: var(--mobile-gap);
                max-width: 70%;
            }
            .brand-name {
                right: 20px;
                bottom: calc(var(--mobile-gap) + (var(--base-font-size) * var(--base-line-height) * 3));
            }
            .page-counter {
                right: 20px;
                bottom: var(--mobile-gap);
            }
            #sec-1-replicated .video-container {
                padding: 30px; 
            }
        }
    </style>
</head>
<body id="main-body">

    <div class="bottom-left-area ui-text" id="label-container"></div>
    <a href="javascript:void(0)" class="brand-name ui-text" id="profile-link">> Wencheng Zhang</a>
    <div class="page-counter ui-text" id="page-counter">01 / 11</div>

    <div class="page-wrapper" id="page-wrapper">
        <!-- 01 -->
        <section class="section active" id="sec-1">
            <div class="top-overlay"></div>
            <div class="video-container">
                <video class="bg-asset" muted loop playsinline preload="auto">
                    <source src="https://img.wusen.me/lazzen-video/1.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- 02 -->
        <section class="section" id="sec-2">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/lazzen-if-gold.jpg');"></div>
        </section>

        <!-- 03 -->
        <section class="section" id="sec-3">
            <div class="top-overlay"></div>
            <div class="video-container">
                <video class="bg-asset" muted loop playsinline preload="auto">
                    <source src="https://img.wusen.me/lazzen-video/2-p.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- 04 -->
        <section class="section" id="sec-4">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/img_9816-compressed.jpg');"></div>
        </section>

        <!-- 05 -->
        <section class="section" id="sec-1-replicated">
            <div class="video-container">
                <video class="bg-asset" muted loop playsinline preload="auto">
                    <source src="https://img.wusen.me/lazzen-video/walkman.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- 06 -->
        <section class="section" id="sec-4-copy">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/img_9805-compressed4.jpg');"></div>
        </section>

        <!-- 07 -->
        <section class="section" id="sec-4-copy-replicated">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/img_1428-compressed.jpg');"></div>
        </section>

        <!-- 08 -->
        <section class="section" id="sec-5">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/p6-leica-m-battery-charger-compressed2.jpg');"></div>
        </section>

        <!-- 09 -->
        <section class="section" id="sec-6">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/buds-compressed3.jpg');"></div>
        </section>

        <!-- 10 -->
        <section class="section" id="sec-8">
            <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/topfront-20comparisoncc.jpg');"></div>
        </section>

        <!-- 11 -->
        <section class="section" id="sec-profile">
        </section>
    </div>

    <script>
        let currentIndex = 0;
        const sections = [
            document.getElementById('sec-1'),
            document.getElementById('sec-2'),
            document.getElementById('sec-3'),
            document.getElementById('sec-4'),
            document.getElementById('sec-1-replicated'),
            document.getElementById('sec-4-copy'),
            document.getElementById('sec-4-copy-replicated'),
            document.getElementById('sec-5'),      
            document.getElementById('sec-6'),
            document.getElementById('sec-8'),
            document.getElementById('sec-profile')
        ];
        
        const projectData = [
            { name: "LNM250M SMART BREAKER", type: "Industrial Design / Motion", team: "Lazzen Hardware", status: "SYNC_RUNNING_01" },
            { name: "ONIBI ARCHIVE 01", type: "Portfolio Collection / Concept", team: "Author: DESIGN LAB", status: "v19.0.0-ALIGNED" },
            { name: "EXPERIMENTAL MOTION", type: "Visual Research / 3D Animation", team: "Author: DESIGN LAB", status: "SYNC_RUNNING_02" },
            { name: "STOOL DESIGN STUDY", type: "Furniture / Archetype Creation", team: "Author: DESIGN LAB", status: "STATIC_RENDER_02" },
            { name: "LNM250M REPLICA", type: "Industrial Design / Motion", team: "Lazzen Hardware", status: "v19.1.0-CENTERED" },
            { name: "STOOL DESIGN STUDY (II)", type: "Furniture / Archetype Creation", team: "Author: DESIGN LAB", status: "STATIC_RENDER_02_ALT" },
            { name: "STOOL DESIGN STUDY (II) COPY", type: "Furniture / Archetype Creation", team: "Author: DESIGN LAB", status: "STATIC_RENDER_02_ALT_REP" },
            { name: "ARCHIVE VISUALIZATION I", type: "Still Image / Product Render", team: "Author: DESIGN LAB", status: "STATIC_RENDER_01" },
            { name: "REMOTE RENDERING SYSTEM", type: "Technical Archive / Visualization", team: "Author: DESIGN LAB", status: "STATIC_RENDER_03" },
            { name: "FUTURE INTERFACE STUDY", type: "UI/UX / Interaction Concept", team: "Author: DESIGN LAB", status: "SYSTEM_IDLE_01" },
            { 
                isProfile: true,
                content: `Wencheng Zhang is a multi-award-winning industrial designer who has a passion for industrial design and excels at archetype-level creation. Currently based in Shanghai.`
            }
        ];

        function updateLabel(index) {
            const data = projectData[index];
            const body = document.getElementById('main-body');
            const profileLink = document.getElementById('profile-link');
            
            body.classList.remove('profile-active', 'force-white');

            if (data.isProfile) {
                body.classList.add('profile-active');
                profileLink.style.display = 'none';
                document.getElementById('label-container').innerHTML = `
                    <div style="max-width: 420px; text-transform: none; text-align: left;">${data.content}</div>
                `;
            } else {
                if (index === 3) {
                    body.classList.add('force-white');
                }
                
                profileLink.style.display = 'block';
                document.getElementById('label-container').innerHTML = `
                    <div>PRODUCT: ${data.name}</div>
                    <div>TYPE:    ${data.type}</div>
                    <div>TEAM:    ${data.team}</div>
                    <div>STATUS:  ${data.status}</div>
                `;
            }

            const pageNum = (index + 1).toString().padStart(2, '0');
            const totalNum = sections.length.toString().padStart(2, '0');
            document.getElementById('page-counter').innerText = `${pageNum} / ${totalNum}`;
        }

        async function playVideo(index) {
            sections.forEach(s => {
                const v = s.querySelector('video');
                if (v) {
                    v.pause();
                    v.classList.remove('visible');
                    v.currentTime = 0;
                }
            });

            const activeVideo = sections[index].querySelector('video');
            if (activeVideo) {
                try {
                    await activeVideo.play();
                    activeVideo.classList.add('visible');
                } catch (e) {}
            }
        }

        let isLocked = false;
        function transitionTo(index) {
            if (isLocked || index < 0 || index >= sections.length || index === currentIndex) return;
            isLocked = true;

            const prevIndex = currentIndex;
            sections[prevIndex].classList.replace('active', 'inactive');
            sections[index].classList.replace('inactive', 'active');

            currentIndex = index;
            updateLabel(index);
            playVideo(index);

            setTimeout(() => {
                isLocked = false;
            }, 800);
        }

        document.getElementById('profile-link').addEventListener('click', () => {
            transitionTo(sections.length - 1);
        });

        sections.forEach((s, i) => {
            if (i !== 0) s.classList.add('inactive');
        });

        updateLabel(0);
        window.addEventListener('load', () => playVideo(0));
        window.addEventListener('wheel', e => {
            if (Math.abs(e.deltaY) < 30) return;
            transitionTo(e.deltaY > 0 ? currentIndex + 1 : currentIndex - 1);
        }, { passive: true });

        let startY = 0;
        window.addEventListener('touchstart', e => startY = e.touches[0].clientY, { passive: true });
        window.addEventListener('touchend', e => {
            const diff = startY - e.changedTouches[0].clientY;
            if (Math.abs(diff) > 50) transitionTo(diff > 0 ? currentIndex + 1 : currentIndex - 1);
        }, { passive: true });

        document.addEventListener('click', () => playVideo(currentIndex), { once: true });
        
        // 禁止移动端的下拉刷新
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) return;
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
