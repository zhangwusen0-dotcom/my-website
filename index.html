<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onibi - Technical Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

        :root {
            --bg-canvas: #000000; 
            --desktop-gap: 25px;
            --mobile-gap: 15px;
            --base-font-size: 11px;
            --base-line-height: 1.6;
            --global-radius: 12px; 
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; 
            background-color: var(--bg-canvas); 
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        /* 核心包装容器 */
        .page-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            z-index: 1;
            transform: translateZ(0);
            transition: border-radius 0.5s ease;
        }

        @media (max-width: 768px) {
            .page-wrapper {
                border-radius: var(--global-radius);
                mask-image: radial-gradient(circle, white 100%, black 100%);
                -webkit-mask-image: -webkit-radial-gradient(white, black);
            }
        }

        .ui-text {
            position: absolute; 
            z-index: 1000;
            mix-blend-mode: difference; 
            color: #fff;
            font-size: var(--base-font-size);
            letter-spacing: 0.05em;
            transition: color 0.5s ease, opacity 0.5s ease;
            line-height: var(--base-line-height);
        }

        /* 针对白色背景的文字颜色强制设置 */
        body.force-black .ui-text {
            mix-blend-mode: normal;
            color: #000000 !important;
        }

        body.profile-active .ui-text {
            mix-blend-mode: normal;
            color: #000;
        }

        body.force-white .ui-text {
            mix-blend-mode: normal;
            color: #ffffff;
        }

        .bottom-left-area {
            left: var(--desktop-gap);
            bottom: var(--desktop-gap);
            text-align: left;
            pointer-events: none;
        }

        .bottom-right-area {
            right: var(--desktop-gap);
            bottom: var(--desktop-gap);
            text-align: right;
            pointer-events: none;
        }

        .brand-link {
            pointer-events: auto;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .brand-link:hover {
            opacity: 0.7;
        }

        .scroll-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
            will-change: transform;
        }

        .section {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000; 
            transition: background-color 0.8s ease;
            cursor: pointer;
        }

        #sec-profile {
            background-color: #ffffff;
        }

        .video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            pointer-events: none;
        }

        #sec-1-replicated .video-container {
            background-color: #ffffff; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sec-1-replicated .video-sub-container {
            width: 80%; 
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-asset {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        video.bg-asset.visible {
            opacity: 1;
        }

        .section-image-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        #sec-4 .section-image-bg, 
        #sec-4-copy .section-image-bg,
        #sec-4-copy-replicated .section-image-bg {
            background-position: bottom center;
        }

        .top-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .bottom-left-area {
                left: var(--mobile-gap); 
                bottom: var(--mobile-gap);
            }
            .bottom-right-area {
                right: var(--mobile-gap);
                bottom: var(--mobile-gap);
            }
            #sec-1-replicated .video-sub-container {
                width: 70%; 
                height: 70%;
            }
        }
    </style>
</head>
<body id="main-body">

    <div class="page-wrapper" id="page-wrapper">
        <div class="bottom-left-area ui-text" id="label-left"></div>
        <div class="bottom-right-area ui-text" id="label-right"></div>

        <div class="scroll-container" id="scroll-container">
            <!-- 第1页 (原第3页内容) -->
            <section class="section" id="sec-3">
                <div class="top-overlay"></div>
                <div class="video-container">
                    <video class="bg-asset" muted loop playsinline preload="auto">
                        <source src="https://img.wusen.me/lazzen-video/2-p.mp4" type="video/mp4">
                    </video>
                </div>
            </section>

            <!-- 第2页 -->
            <section class="section" id="sec-2">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/lazzen-if-gold.jpg');"></div>
            </section>

            <!-- 第3页 (原第1页内容) -->
            <section class="section" id="sec-1">
                <div class="top-overlay"></div>
                <div class="video-container">
                    <video id="hero-video" class="bg-asset" muted loop playsinline preload="auto"></video>
                </div>
            </section>

            <!-- 第4页 -->
            <section class="section" id="sec-4">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/img_9816-compressed.jpg');"></div>
            </section>

            <!-- 第5页 -->
            <section class="section" id="sec-1-replicated">
                <div class="video-container">
                    <div class="video-sub-container">
                        <video class="bg-asset" muted loop playsinline preload="auto">
                            <source src="https://img.wusen.me/lazzen-video/walkman.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </section>

            <!-- 其他页 -->
            <section class="section" id="sec-4-copy">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/img_9805-compressed4.jpg');"></div>
            </section>

            <section class="section" id="sec-4-copy-replicated">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/img_1428-compressed.jpg');"></div>
            </section>

            <section class="section" id="sec-5">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/p6-leica-m-battery-charger-compressed2.jpg');"></div>
            </section>

            <section class="section" id="sec-6">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/buds-compressed3.jpg');"></div>
            </section>

            <section class="section" id="sec-8">
                <div class="section-image-bg" style="background-image: url('https://img.wusen.me/2026/04/topfront-20comparisoncc.jpg');"></div>
            </section>

            <section class="section" id="sec-profile">
            </section>
        </div>
    </div>

    <script>
        const HERO_VIDEO_CONFIG = {
            desktop: "https://img.wusen.me/lazzen-video/1.mp4",
            mobile:  "https://img.wusen.me/lazzen-video/1-p.mp4" 
        };

        function setupHeroVideo() {
            const videoEl = document.getElementById('hero-video');
            if (!videoEl) return;
            const isMobile = window.innerWidth <= 768;
            const videoSrc = isMobile ? HERO_VIDEO_CONFIG.mobile : HERO_VIDEO_CONFIG.desktop;
            
            if (videoEl.getAttribute('data-current-src') !== videoSrc) {
                videoEl.pause();
                videoEl.innerHTML = `<source src="${videoSrc}" type="video/mp4">`;
                videoEl.setAttribute('data-current-src', videoSrc);
                videoEl.load();
                
                videoEl.onloadedmetadata = () => {
                    if (currentIndex === 2) {
                        const playPromise = videoEl.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                videoEl.classList.add('visible');
                            }).catch(error => console.log("Playback error:", error));
                        }
                    }
                };
            }
        }

        let currentIndex = 0;
        const scrollContainer = document.getElementById('scroll-container');
        const sections = Array.from(document.querySelectorAll('.section'));
        
        // 此处同步修改了编号：Index 0 设为 01，Index 2 设为 03
        const projectData = [
            { 
                customLabels: ["PRODUCT: LAZZEN CIRCUIT BREAKER - 01", "TEAM ROLE: CREATIVE LEAD", "AWARD: iF GOLD AWARD", "STATUS: MASS PRODUCTION"], 
                bgColor: "#050505" 
            },
            { 
                customLabels: ["PRODUCT: LAZZEN CIRCUIT BREAKER - 02", "TEAM ROLE: CREATIVE LEAD", "AWARD: iF GOLD AWARD", "STATUS: MASS PRODUCTION"], 
                bgColor: "#1a1a1a" 
            },
            { 
                customLabels: ["PRODUCT: LAZZEN CIRCUIT BREAKER - 03", "TEAM ROLE: CREATIVE LEAD", "AWARD: iF GOLD AWARD", "STATUS: MASS PRODUCTION"], 
                bgColor: "#0a0a0a" 
            },
            { 
                customLabels: ["Nagra SN, Walkman & TP-7 Inspired", "Music Player", "Personal Project", "Status: Under Development"], 
                bgColor: "#222222" 
            },
            { name: "LNM250M REPLICA", type: "Industrial Design / Motion", team: "Lazzen Hardware", status: "v19.1.0-CENTERED", bgColor: "#ffffff" },
            { name: "STOOL DESIGN STUDY (II)", type: "Furniture / Archetype Creation", team: "Author: DESIGN LAB", status: "STATIC_RENDER_02_ALT", bgColor: "#121212" },
            { name: "STOOL DESIGN STUDY (II) COPY", type: "Furniture / Archetype Creation", team: "Author: DESIGN LAB", status: "STATIC_RENDER_02_ALT_REP", bgColor: "#0d0d0d" },
            { name: "ARCHIVE VISUALIZATION I", type: "Still Image / Product Render", team: "Author: DESIGN LAB", status: "STATIC_RENDER_01", bgColor: "#1f1f1f" },
            { name: "REMOTE RENDERING SYSTEM", type: "Technical Archive / Visualization", team: "Author: DESIGN LAB", status: "STATIC_RENDER_03", bgColor: "#141414" },
            { name: "FUTURE INTERFACE STUDY", type: "UI/UX / Interaction Concept", team: "Author: DESIGN LAB", status: "SYSTEM_IDLE_01", bgColor: "#000000" },
            { isProfile: true, bgColor: "#ffffff", content: `Wencheng Zhang is a multi-award-winning industrial designer who has a passion for industrial design and excels at archetype-level creation. Currently based in Shanghai.` }
        ];

        function updateLabel(index) {
            const data = projectData[index];
            const body = document.getElementById('main-body');
            const leftContainer = document.getElementById('label-left');
            const rightContainer = document.getElementById('label-right');
            const currentSection = sections[index];
            
            currentSection.style.backgroundColor = data.bgColor || "#000000";
            
            body.classList.remove('profile-active', 'force-white', 'force-black');

            const pageNum = (index + 1).toString().padStart(2, '0');
            const totalNum = sections.length.toString().padStart(2, '0');

            if (data.isProfile) {
                body.classList.add('profile-active');
                leftContainer.innerHTML = `<div style="max-width: 420px;">${data.content}</div>`;
                rightContainer.innerHTML = ''; 
            } else {
                if (index === 4) {
                    body.classList.add('force-black');
                } else if (index === 3 || (index === 2 && data.bgColor === "#ffffff")) {
                    body.classList.add('force-white');
                }
                
                if (data.customLabels) {
                    leftContainer.innerHTML = data.customLabels.map(line => `<div>${line}</div>`).join('');
                } else {
                    leftContainer.innerHTML = `
                        <div>PRODUCT: ${data.name}</div>
                        <div>TYPE:    ${data.type}</div>
                        <div>TEAM:    ${data.team}</div>
                        <div>STATUS:  ${data.status}</div>
                    `;
                }

                rightContainer.innerHTML = `
                    <a href="javascript:void(0)" class="brand-link" onclick="transitionTo(${sections.length - 1}); event.stopPropagation();">> WENCHENG ZHANG</a>
                    <div>${pageNum} / ${totalNum}</div>
                    <div>&nbsp;</div>
                    <div>&nbsp;</div>
                `;
            }
        }

        async function playVideo(index) {
            sections.forEach((s, i) => {
                const v = s.querySelector('video');
                if (v) {
                    if (i === index) {
                        v.currentTime = 0;
                        const p = v.play();
                        if (p !== undefined) p.then(() => v.classList.add('visible')).catch(() => {});
                    } else {
                        v.pause();
                        v.classList.remove('visible');
                    }
                }
            });
        }

        let isLocked = false;
        function transitionTo(index) {
            if (isLocked || index < 0 || index >= sections.length || index === currentIndex) return;
            isLocked = true;
            currentIndex = index;
            scrollContainer.style.transform = `translateY(-${index * 100}%)`;
            updateLabel(index);
            playVideo(index);
            setTimeout(() => { isLocked = false; }, 800);
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.brand-link')) return;
            const height = window.innerHeight;
            const clickY = e.clientY;
            if (clickY < height / 2) {
                transitionTo(currentIndex - 1);
            } else {
                transitionTo(currentIndex + 1);
            }
        });

        setupHeroVideo();
        updateLabel(0);
        
        window.addEventListener('load', () => { setupHeroVideo(); playVideo(0); });
        window.addEventListener('resize', setupHeroVideo);

        window.addEventListener('wheel', e => {
            if (isLocked || Math.abs(e.deltaY) < 30) return;
            transitionTo(e.deltaY > 0 ? currentIndex + 1 : currentIndex - 1);
        }, { passive: true });

        let startY = 0;
        window.addEventListener('touchstart', e => startY = e.touches[0].clientY, { passive: true });
        window.addEventListener('touchend', e => {
            const diff = startY - e.changedTouches[0].clientY;
            if (Math.abs(diff) > 50) transitionTo(diff > 0 ? currentIndex + 1 : currentIndex - 1);
        }, { passive: true });

        document.addEventListener('touchmove', e => { if (e.touches.length === 1) e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
